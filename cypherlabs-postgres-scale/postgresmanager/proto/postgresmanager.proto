syntax = "proto3";

package cypherlabs.postgres.scale.postgresmanager;

service PostgresManager {
    rpc StartPrimary (StartPrimaryRequest) returns (StartPrimaryResponse);
    rpc CreateReplicationSlot (CreateReplicationSlotRequest) returns (CreateReplicationSlotResponse);
    rpc StartReplica (StartReplicaRequest) returns (StartReplicaResponse);
    rpc Status (StatusRequest) returns (StatusResponse);
    rpc Promote (PromoteRequest) returns (PromoteResponse);
}

message StartPrimaryRequest {
    string data_dir = 1;
    uint32 port = 2;
}

message StartPrimaryResponse {
    uint32 pid = 1;
}

message CreateReplicationSlotRequest {
    string slot_name = 1;
}

message CreateReplicationSlotResponse {
    string lsn = 1;
}

message StartReplicaRequest {
    string data_dir = 1;
    uint32 port = 2;
    string primary_host = 3;
    uint32 primary_port = 4;
    string slot_name = 5;
}

message StartReplicaResponse {
    uint32 pid = 1;
}

message StatusRequest {

}

enum State {
    STATE_UNSPECIFIED = 0;
    STATE_NOT_STARTED = 1;
    STATE_RUNNING = 2;
    STATE_EXITED = 3;
}

enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_PRIMARY = 1;
    ROLE_REPLICA = 2;
}

message StatusResponse {
    State state = 1;
    Role role = 2;
    uint32 port = 3;
    uint32 pid = 4;
}

message PromoteRequest {

}

message PromoteResponse {

}